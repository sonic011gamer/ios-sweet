name: eagl

# EAGL shim for backboardd (t290/eagl): CoreAnimation's GLES renderer on Mesa.
on:
  workflow_dispatch:
  push:
    branches: [t290]
    paths:
      - "t290/eagl/**"
      - ".github/workflows/eagl.yml"

jobs:
  layout:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: GLI dispatch layout (macOS SDK)
        run: |
          h=$(xcrun --sdk macosx --show-sdk-path)/System/Library/Frameworks/OpenGL.framework/Headers/gliDispatch.h
          ls -la "$h"
          python3 t290/eagl/gli_layout.py "$h" | tee gli-layout.txt
          wc -l gli-layout.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gli-layout
          path: gli-layout.txt

  shim:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p out
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          python3 t290/eagl/gen_dispatch.py "$sdk" t290/eagl/dispatch_generated.h
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -fobjc-arc \
            -dynamiclib -install_name /usr/lib/t290eagl.dylib -o out/t290eagl.dylib \
            t290/eagl/eaglshim.m -framework Foundation -framework IOKit -framework IOSurface
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -fobjc-arc \
            -dynamiclib -install_name /usr/lib/t290eagl-probe.dylib -o out/t290eagl-probe.dylib \
            t290/eagl/eaglprobe.m -framework Foundation -framework IOKit
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -fobjc-arc \
            -o out/eagltest t290/eagl/eagltest.m -framework Foundation -framework OpenGLES -framework IOSurface
          codesign -s - -f out/t290eagl.dylib out/t290eagl-probe.dylib
          codesign -s - -f --entitlements t290/ios/ent.plist out/eagltest
          otool -L out/t290eagl.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: t290eagl
          path: out

  mac-smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Mesa EAGL smoke test (fake GPU)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(gh run list --workflow mesa-ios.yml --branch t290 --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$run" -n mesa-mac -D mesa-mac
          lib=$(find "$PWD/mesa-mac" -name libOSMesa.8.dylib -print -quit)
          test -n "$lib"
          python3 t290/eagl/gen_dispatch.py "$(xcrun --sdk macosx --show-sdk-path)" t290/eagl/dispatch_generated.h
          clang -O2 -Wall -fobjc-arc -dynamiclib -o t290eagl.dylib t290/eagl/eaglshim.m \
            -framework Foundation -framework IOKit -framework IOSurface
          clang -O2 -Wall -fobjc-arc -o eagltest t290/eagl/eagltest.m -framework Foundation -framework IOSurface
          codesign -s - -f t290eagl.dylib eagltest
          export T290_MESA_LIB="$lib" SWEET_FAKE=1 DYLD_INSERT_LIBRARIES="$PWD/t290eagl.dylib"
          perl -e 'alarm 120; exec @ARGV' ./eagltest
