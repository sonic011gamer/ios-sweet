name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      sweet_board:
        description: SWEET board variant (empty = sweet phone, t290 = Galaxy Tab A 8.0 SM-T290, 4K pages + GICv2)
        default: ""
      runner:
        description: Hosted build runner (macos-15-intel bypasses ARM capacity limits)
        default: macos-14
      iig_cache_release:
        description: Optional draft release containing verified Xcode 15 IIG outputs
        default: ""
      iig_cache_sha256:
        description: SHA256 of the optional IIG cache artifact
        default: ""
      kernel_artifact_run:
        description: Reuse a verified T290 kernel after workflow-only changes
        default: ""
      kernel_artifact_sha256:
        description: Required SHA256 when reusing an already compiled kernel
        default: ""
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  SWEET_BOARD: ${{ inputs.sweet_board || '' }}

jobs:
  build:
    # Draft build-cache assets are visible only to write-capable repository
    # tokens. Needed by the optional compatible-IIG download above the build.
    permissions:
      contents: write
      actions: read
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: ${{ inputs.runner || 'macos-14' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Reuse verified compiled T290 kernel
        if: inputs.kernel_artifact_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_RUN: ${{ inputs.kernel_artifact_run }}
          KERNEL_SHA: ${{ inputs.kernel_artifact_sha256 }}
        run: |
          set -euo pipefail
          test "$SWEET_BOARD" = t290
          test "$MACHINE_CONFIG" = SWEET
          test "$KERNEL_CONFIG" = DEVELOPMENT
          test "$MACOS_VERSION" = 13.5
          base=$(gh run view "$KERNEL_RUN" --json headSha --jq .headSha)
          git fetch origin "$base" --depth=1
          git diff --exit-code "$base" "$GITHUB_SHA" -- xnu/patches tools/iig-cache.py
          old_dxb=$(git show "$base:.github/workflows/xnu.yml" | awk '/^  DXB_SHA:/ {print $2}')
          test "$old_dxb" = "$DXB_SHA"
          gh run download "$KERNEL_RUN" -n xnu-kernel -D out
          printf '%s  %s\n' "$KERNEL_SHA" out/kernel.development.sweet | shasum -a 256 -c -
          echo "Reused kernel from $KERNEL_RUN: source patches, generator and SHA256 verified"

      - name: Compatible IIG cache for alternate host
        if: inputs.iig_cache_release != '' && inputs.kernel_artifact_run == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_RELEASE: ${{ inputs.iig_cache_release }}
          CACHE_SHA256: ${{ inputs.iig_cache_sha256 }}
        run: |
          set -euo pipefail
          gh release download "$CACHE_RELEASE" -p iig-cache.json.xz -D iig-cache
          printf '%s  %s\n' "$CACHE_SHA256" iig-cache/iig-cache.json.xz | shasum -a 256 -c -
          chmod +x tools/iig-cache.py
          echo "IIG=$GITHUB_WORKSPACE/tools/iig-cache.py" >> "$GITHUB_ENV"
          echo "IIG_CACHE=$GITHUB_WORKSPACE/iig-cache/iig-cache.json.xz" >> "$GITHUB_ENV"
          echo "IIG_SOURCE_ROOT=$GITHUB_WORKSPACE/dxb/xnu" >> "$GITHUB_ENV"

      - name: Fetch build script
        if: inputs.kernel_artifact_run == ''
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          # SWEET_BOARD=t290: libfirehose_kernel is linked into the kernel, so its
          # arm64 slice must also avoid LSE (Cortex-A53): same CPU flag as the kernel.
          if [ "$SWEET_BOARD" = t290 ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('dxb/build.sh')
          t = p.read_text()
          i = t.index('xcodebuild install -target libfirehose_kernel')
          j = t.rindex('        cd "${SRCROOT}"\n', 0, i)
          line = ("        echo 'OTHER_CFLAGS[arch=arm64] = -mkernel -nostdinc -Wno-packed -mcpu=cortex-a53' "
                  '>> "${SRCROOT}/xcodeconfig/libfirehose_kernel.xcconfig"\n')
          p.write_text(t[:j] + line + t[j:])
          PY
            grep -n 'mcpu=cortex-a53' dxb/build.sh
          fi
          ls dxb/patches

      - name: Deps
        if: inputs.kernel_artifact_run == ''
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        if: inputs.kernel_artifact_run == ''
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Package build tree for local compiles
        if: always()
        run: |
          test -d dxb/build/xnu.obj || exit 0
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            test -f "$lib" || continue
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn

  # One workflow run produces the kernel and bridge, with a self-contained
  # host Mesa test. No dependency on previously retained Actions history.
  t290-graphics:
    if: inputs.sweet_board == 't290'
    runs-on: ${{ inputs.runner || 'macos-14' }}
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS graphics bridge
        run: |
          set -euo pipefail
          mkdir -p graphics-out
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          python3 t290/eagl/gen_dispatch.py "$sdk" t290/eagl/dispatch_generated.h
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -fobjc-arc \
            -dynamiclib -Wl,-not_for_dyld_shared_cache \
            -install_name /usr/lib/t290eagl.dylib -o graphics-out/t290eagl.dylib \
            t290/eagl/eaglshim.m -framework Foundation -framework IOKit -framework IOSurface
          xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -O2 -Wall -fobjc-arc \
            -o graphics-out/eagltest t290/eagl/eagltest.m \
            -framework Foundation -framework OpenGLES -framework IOSurface
          codesign -s - -f graphics-out/t290eagl.dylib
          codesign -s - -f --entitlements t290/ios/ent.plist graphics-out/eagltest
          otool -L graphics-out/t290eagl.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: t290eagl
          path: graphics-out/
      - name: Host Mesa tools
        run: |
          python3 -m pip install --break-system-packages meson==1.5.2 mako pyyaml packaging || \
            python3 -m pip install meson==1.5.2 mako pyyaml packaging
          brew install ninja bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Build host Mesa
        run: TARGET=mac WORK=$PWD/mesa-host bash t290/mesa/build-ios.sh
      - name: ES2 and ES3 bridge regressions (fake GPU)
        run: |
          set -euo pipefail
          clang -O2 -Wall -fobjc-arc -dynamiclib -Wl,-not_for_dyld_shared_cache \
            -o host-t290eagl.dylib t290/eagl/eaglshim.m \
            -framework Foundation -framework IOKit -framework IOSurface
          clang -O2 -Wall -fobjc-arc -o host-eagltest t290/eagl/eagltest.m \
            -framework Foundation -framework IOSurface
          codesign -s - -f host-t290eagl.dylib host-eagltest
          export T290_MESA_LIB="$PWD/mesa-host/out/libOSMesa.8.dylib"
          export SWEET_FAKE=1 DYLD_INSERT_LIBRARIES="$PWD/host-t290eagl.dylib"
          perl -e 'alarm 120; exec @ARGV' ./host-eagltest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t290-host-test
          path: |
            mesa-host/build.log
            mesa-host/out/
